services:
  - type: web
    name: qflow-queue-management
    env: node
    plan: free
    buildCommand: "npm run install:all && npm run build && npm run seed"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
